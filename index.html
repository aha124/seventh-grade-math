<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seventh Grade Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/style.css">
<style>
.wrap{max-width:900px;margin:0 auto;padding:0 1.25rem}
.sess{font-family:var(--display);font-weight:500;font-size:1.05rem;color:var(--ice);letter-spacing:.06em}

.lede{margin:1.5rem 0 .2rem;max-width:52ch;font-size:1.12rem}

/* One section per lesson, newest first. The heading carries the lesson
   number and topic so a tile never has to say which lesson it belongs to. */
.lesson{margin:2.1rem 0 0}
.lesson-head{margin:0;padding-bottom:.5rem;border-bottom:1.5px solid var(--line)}
.lnum{
  display:block;
  font-family:var(--body);font-size:.72rem;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:#7C93A5;
}
.ltitle{
  display:block;
  font-family:var(--display);font-weight:700;
  font-size:1.5rem;line-height:1.15;letter-spacing:.01em;color:var(--board);
  margin-top:.15rem;
}

/* Five rows per lesson, one per school day. Each row is a label on the
   left and that day's tiles on the right; below 640px the label sits
   above the tiles instead. A day with no pages shows its note in the
   tile slot, so the week keeps its shape. */
.days{margin:0;padding:0;list-style:none}
.day{
  display:grid;grid-template-columns:1fr;gap:.55rem;
  padding:.85rem 0;
  border-bottom:1px solid var(--line);
}
@media (min-width:640px){
  .day{grid-template-columns:11.5rem 1fr;gap:1.1rem;align-items:start}
}
.day-label{display:flex;flex-direction:column;gap:.1rem;padding-top:.15rem}
.dnum{
  font-family:var(--body);font-size:.72rem;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--edge);
}
.dname{
  font-family:var(--display);font-weight:600;
  font-size:1.25rem;line-height:1.15;color:var(--board);
}
.day.empty .dnum{color:#7C93A5}
.day.empty .dname{color:var(--board-soft)}
.day-note{
  display:flex;align-items:center;
  margin:0;min-height:2.4rem;
  font-size:.98rem;color:var(--board-soft);
}
.day-note::before{
  content:"";flex:0 0 auto;
  width:.55rem;height:.55rem;margin-right:.7rem;
  border-radius:50%;border:1.5px solid var(--line);background:var(--rink);
}

/* The tile grid fills across as many columns as fit, so a third page on
   a day just drops in. Nothing here counts the tiles. */
.tiles{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(13.5rem,1fr));
  gap:.65rem;
  margin:0;
  padding:0;
  list-style:none;
}
.tile{
  display:flex;flex-direction:column;
  height:100%;
  background:var(--paper);
  border:1.5px solid var(--line);
  border-left:5px solid var(--edge);
  border-radius:3px;
  padding:.7rem .9rem .75rem;
  text-decoration:none;color:inherit;
  box-shadow:0 2px 0 rgba(16,36,58,.09);
}
.tile:hover,.tile:focus-visible{border-left-color:var(--gold);background:#FBFDFE}
.tile h3{
  font-family:var(--display);font-weight:700;
  font-size:1.35rem;line-height:1.05;letter-spacing:.01em;
  margin:0 0 .3rem;color:var(--board);
}
.tile p{margin:0;font-size:.92rem;line-height:1.4;color:var(--board-soft)}
.tile .go{
  margin-top:auto;padding-top:.55rem;
  font-family:var(--display);font-size:1.02rem;font-weight:600;color:var(--edge);
}

.nolist{margin:1.6rem 0 0;color:var(--board-soft)}
.foot{margin:2.4rem 0 0;padding-top:1rem;border-top:1.5px solid var(--line);font-size:.95rem;color:#7C93A5;max-width:56ch}
</style>
</head>
<body>

<header class="board">
  <div class="wrap">
    <h1 class="mark">Seventh Grade <span>Math</span></h1>
    <div class="sess">Practice tools</div>
  </div>
</header>

<main class="wrap">
  <p class="lede">Pick the one you want to work on. You can come back to any of them as many times as you like.</p>

  <div id="lessons">
    <p class="nolist">The list could not load. Open <code>index.html</code> from the folder that holds <code>site.js</code>.</p>
  </div>

  <p class="foot">Everything here runs in the browser. Nothing you type gets sent anywhere.</p>
</main>

<script src="site.js"></script>
<script>
/* Builds the list from LESSONS in site.js. If that file is missing the
   fallback paragraph above is left in place rather than an empty page. */
(function(){
  const host = document.getElementById('lessons');
  if (typeof LESSONS === 'undefined' || !Array.isArray(LESSONS)) return;

  function tileFor(page){
    const item = document.createElement('li');
    const tile = document.createElement('a');
    tile.className = 'tile';
    tile.href = page.href;

    const name = document.createElement('h3');
    name.textContent = page.name;
    const blurb = document.createElement('p');
    blurb.textContent = page.blurb;
    const go = document.createElement('span');
    go.className = 'go';
    go.textContent = (page.cta || 'Open') + ' →';

    tile.append(name, blurb, go);
    item.append(tile);
    return item;
  }

  function rowFor(day){
    const pages = Array.isArray(day.pages) ? day.pages : [];
    const row = document.createElement('li');
    row.className = 'day' + (pages.length ? '' : ' empty');

    const label = document.createElement('div');
    label.className = 'day-label';
    const num = document.createElement('span');
    num.className = 'dnum';
    num.textContent = 'Day ' + day.d;
    const name = document.createElement('span');
    name.className = 'dname';
    name.textContent = day.name;
    label.append(num, name);
    row.append(label);

    if (pages.length){
      const list = document.createElement('ul');
      list.className = 'tiles';
      pages.forEach(page => list.append(tileFor(page)));
      row.append(list);
    } else {
      const note = document.createElement('p');
      note.className = 'day-note';
      note.textContent = day.note || 'Nothing on the site for this day.';
      row.append(note);
    }
    return row;
  }

  const frag = document.createDocumentFragment();

  [...LESSONS].sort((a, b) => b.n - a.n).forEach(lesson => {
    const section = document.createElement('section');
    section.className = 'lesson';

    const head = document.createElement('h2');
    head.className = 'lesson-head';
    const num = document.createElement('span');
    num.className = 'lnum';
    num.textContent = 'Lesson ' + lesson.n;
    const title = document.createElement('span');
    title.className = 'ltitle';
    title.textContent = lesson.title;
    head.append(num, title);

    const days = document.createElement('ol');
    days.className = 'days';
    [...(lesson.days || [])].sort((a, b) => a.d - b.d).forEach(day => days.append(rowFor(day)));

    section.append(head, days);
    frag.append(section);
  });

  host.textContent = '';
  host.append(frag);
})();
</script>

</body>
</html>

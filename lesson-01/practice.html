<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practice — Mean, Median, Mode, Range</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/style.css">
<style>
/* Card geometry is declared here, not inherited, because the drag math
   depends on a full row never wrapping. Sets here run to 8 cards, so these
   clamps are a little tighter than the lesson page's. See shared/style.css. */
:root{
  --rail-min-height:140px;
  --card-w:clamp(40px,10.5vw,84px);
  --card-h:clamp(58px,14.5vw,114px);
  --card-size:clamp(1.15rem,3.2vw,2.1rem);
  --card-tag-size:clamp(.42rem,1.1vw,.6rem);
  --card-tag-track:.07em;
  --card-lift:-13px;

  --board-pad-top:1rem;
  --board-pad-bottom:1.1rem;
  --mark-size:clamp(1.8rem,6vw,2.7rem);
}
.wrap{max-width:820px;margin:0 auto;padding:0 1.25rem}
.tally{font-family:var(--display);font-weight:500;font-size:1.05rem;color:var(--ice);letter-spacing:.05em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:.7rem}
.clear{font-family:var(--body);font-size:.8rem;font-weight:500;letter-spacing:0;
  background:none;border:none;padding:0;color:var(--ice);opacity:.75;
  text-decoration:underline;cursor:pointer;-webkit-tap-highlight-color:transparent}
.clear:hover{opacity:1}
.clear[hidden]{display:none}
.clear.arming{color:var(--gold);opacity:1;text-decoration:none;font-weight:600}

.scene{margin:1.3rem 0 .4rem;max-width:60ch;font-size:1.12rem}
.scene b{font-weight:600}

.hint-line{text-align:center;font-size:.95rem;color:var(--board-soft);min-height:1.6em;margin:.2rem 0 1.4rem}
.hint-line.done{color:var(--edge);font-weight:600}

/* answer sheet */
.sheet{background:var(--paper);border:1.5px solid var(--line);border-radius:3px;overflow:hidden}
.sheet.locked{opacity:.45}
.row{display:grid;grid-template-columns:5.6rem 1fr auto auto;gap:.6rem;align-items:center;padding:.7rem .9rem;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
@media (max-width:480px){.row{grid-template-columns:4.6rem 1fr auto auto;gap:.4rem;padding:.6rem .5rem}}
.row label{font-family:var(--display);font-size:1.3rem;font-weight:600}
.row input{
  width:100%;font-family:var(--display);font-size:1.35rem;font-weight:600;
  padding:.35rem .55rem;border:1.5px solid var(--line);border-radius:3px;
  background:var(--rink);color:var(--board);font-variant-numeric:tabular-nums;
}
.row input:disabled{background:#F4F7F9}
.row.right input{border-color:var(--good);background:#EFF7F2;color:var(--good)}
.row.wrong input{border-color:var(--gold);background:#FBF5EA}
.state{font-family:var(--display);font-size:1.1rem;min-width:4.6rem;text-align:right;color:var(--board-soft)}
.row.right .state{color:var(--good)}
.row.wrong .state{color:var(--gold)}
.hbtn,.export-btn{
  font-family:var(--display);font-size:1rem;font-weight:600;
  background:none;border:1.5px solid var(--line);color:var(--board-soft);
  border-radius:3px;padding:.3rem .6rem;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.hbtn:disabled,.export-btn:disabled{opacity:.35;cursor:default}
.tip{grid-column:1/-1;font-size:.97rem;color:var(--board-soft);background:#F6FAFC;border-left:4px solid var(--gold);padding:.5rem .7rem;margin:.5rem 0 0;border-radius:2px}

.banner{
  margin:1.2rem 0 0;padding:.85rem 1rem;border-radius:3px;
  background:#E8F4EC;border:1.5px solid var(--good);color:var(--good);
  font-family:var(--display);font-size:1.35rem;font-weight:600;display:none;
}
.banner.show{display:block}
/* problem log */
details.log{margin:1.8rem 0 0;border-top:1.5px solid var(--line);padding-top:.9rem}
details.log summary{font-family:var(--display);font-size:1.15rem;font-weight:600;color:var(--board-soft);cursor:pointer;list-style:none;-webkit-tap-highlight-color:transparent}
details.log summary::-webkit-details-marker{display:none}
details.log summary::before{content:"▸ ";color:var(--ice)}
details.log[open] summary::before{content:"▾ ";color:var(--ice)}
.log-body{margin:.9rem 0 0}
.log-empty{margin:0;color:#7C93A5;font-size:.95rem}

.accuracy{display:flex;flex-wrap:wrap;gap:.45rem;margin:0 0 .9rem;padding:0;list-style:none}
.accuracy li{
  font-family:var(--display);font-size:1rem;font-weight:600;color:var(--board-soft);
  background:var(--paper);border:1.5px solid var(--line);border-radius:3px;
  padding:.25rem .55rem;font-variant-numeric:tabular-nums;
}
.accuracy b{color:var(--board);font-weight:700}
.accuracy-note{margin:0 0 .9rem;font-size:.88rem;color:#7C93A5}

.log-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.log-table{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.log-table th,.log-table td{padding:.35rem .5rem;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
.log-table thead th{font-family:var(--display);font-weight:600;font-size:.95rem;color:var(--board-soft)}
.log-table tbody tr:last-child td{border-bottom:none}
.log-table .stat{text-align:center}
.log-table .yes{color:var(--good);font-weight:600}
.log-table .no{color:var(--gold);font-weight:600}
.log-table .hints{font-size:.75em;color:#7C93A5;font-weight:500}

.log-actions{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:.9rem 0 0}
.export-note{font-size:.88rem;color:var(--board-soft)}
.export-box{
  display:block;width:100%;margin:.7rem 0 0;min-height:7rem;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8rem;
  border:1.5px solid var(--line);border-radius:3px;padding:.5rem;
  background:var(--paper);color:var(--board-soft);
}
.export-box[hidden]{display:none}

.foot{margin:2.2rem 0 0;font-size:.92rem;color:#7C93A5;max-width:60ch}
</style>
</head>
<body>

<header class="board">
  <div class="wrap">
    <div class="board-nav"><a class="backlink" href="../index.html">All lessons</a></div>
    <h1 class="mark">Practice <span>Set</span></h1>
    <div class="tally">
      <span id="tally">Solved 0 &nbsp;/&nbsp; Clean 0</span>
      <button class="clear" id="clear" type="button" hidden>Start over</button>
    </div>
  </div>
</header>

<main class="wrap">
  <p class="scene" id="scene"></p>

  <div class="rail" id="rail"></div>
  <p class="hint-line" id="hintline"></p>

  <div class="sheet locked" id="sheet">
    <div class="row" data-stat="median">
      <label for="in-median">Median</label>
      <input id="in-median" inputmode="decimal" autocomplete="off" disabled>
      <button class="hbtn" data-hint="median" disabled>Hint</button>
      <span class="state"></span>
    </div>
    <div class="row" data-stat="mode">
      <label for="in-mode">Mode</label>
      <input id="in-mode" inputmode="decimal" autocomplete="off" disabled placeholder="a number, or none">
      <button class="hbtn" data-hint="mode" disabled>Hint</button>
      <span class="state"></span>
    </div>
    <div class="row" data-stat="range">
      <label for="in-range">Range</label>
      <input id="in-range" inputmode="decimal" autocomplete="off" disabled>
      <button class="hbtn" data-hint="range" disabled>Hint</button>
      <span class="state"></span>
    </div>
    <div class="row" data-stat="mean">
      <label for="in-mean">Mean</label>
      <input id="in-mean" inputmode="decimal" autocomplete="off" disabled>
      <button class="hbtn" data-hint="mean" disabled>Hint</button>
      <span class="state"></span>
    </div>
  </div>

  <div class="banner" id="banner"></div>

  <div class="actions">
    <button class="btn primary" id="check" disabled>Check answers</button>
    <button class="btn ghost" id="next">New problem</button>
  </div>

  <details class="log">
    <summary>Progress</summary>
    <div class="log-body">
      <ul class="accuracy" id="accuracy"></ul>
      <p class="accuracy-note" id="accuracyNote"></p>
      <div class="log-scroll">
        <table class="log-table" id="logTable">
          <thead>
            <tr>
              <th scope="col">When</th>
              <th scope="col">Set</th>
              <th scope="col">Cards</th>
              <th scope="col" class="stat" title="Median">Med</th>
              <th scope="col" class="stat" title="Mode">Mode</th>
              <th scope="col" class="stat" title="Range">Range</th>
              <th scope="col" class="stat" title="Mean">Mean</th>
            </tr>
          </thead>
          <tbody id="logRows"></tbody>
        </table>
      </div>
      <p class="log-empty" id="logEmpty" hidden>Nothing solved yet. Finish a problem and it will show up here.</p>
      <div class="log-actions">
        <button class="export-btn" id="export" type="button">Export</button>
        <span class="export-note" id="exportNote"></span>
      </div>
      <textarea class="export-box" id="exportBox" readonly hidden aria-label="Log as JSON"></textarea>
    </div>
  </details>

  <p class="foot">Answers are checked, never shown. 5.4, 5.40 and 05.400 all count as the same answer. If a set has two modes, type both: 5.4, 5.6</p>
</main>

<script>
/* ---------------- scenarios ---------------- */
const SCENES = [
  { tag:'JUDGE',   dec:1, lo:35,  hi:62,  text:n=>`${n} judges scored the same free skate.` },
  { tag:'SESSION', dec:0, lo:3,   hi:22,  text:n=>`Jumps landed cleanly in each of ${n} practice sessions.` },
  { tag:'DAY',     dec:0, lo:35,  hi:125, text:n=>`Minutes spent practicing on ${n} different days.` },
  { tag:'QUIZ',    dec:0, lo:62,  hi:100, text:n=>`Scores on the last ${n} quizzes.` },
  { tag:'GAME',    dec:0, lo:0,   hi:14,  text:n=>`Points the team scored in ${n} games this season.` },
  { tag:'DAY',     dec:0, lo:28,  hi:88,  text:n=>`High temperature, in degrees, for ${n} days in a row.` },
  { tag:'VIDEO',   dec:1, lo:24,  hi:180, text:n=>`Length in minutes of the last ${n} videos she watched.` },
  { tag:'DOG',     dec:1, lo:85,  hi:640, text:n=>`Weight in pounds of ${n} dogs at the shelter.` }
];

/* ---------------- state ---------------- */
let scene, dec, vals = [], order = [], picked = null, busy = false;
let usedHintOrMiss = false;

/* ---------------- saved progress ----------------
   One namespaced key holds the whole record. Every touch of localStorage
   is guarded, so the page still works where storage is turned off or full.
   The counts just stop surviving a reload. */
const STORE_KEY = 'seventh-grade-math:mmmr';
let solved = 0, clean = 0;

function loadProgress(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (Number.isFinite(saved.solved)) solved = Math.max(0, Math.floor(saved.solved));
    if (Number.isFinite(saved.clean))  clean  = Math.max(0, Math.floor(saved.clean));
    if (clean > solved) clean = solved;
  } catch (e) { solved = 0; clean = 0; }
}

function saveProgress(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify({solved, clean})); }
  catch (e) { /* nothing to do; the counts stay in memory for this visit */ }
}

function clearProgress(){
  solved = 0; clean = 0;
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  drawTally();
  clearLog();
}

function drawTally(){
  document.getElementById('tally').textContent =
    `Solved ${solved} \u00A0/\u00A0 Clean ${clean}`;
  document.getElementById('clear').hidden = solved === 0 && clean === 0;
}

/* ---------------- problem log ----------------
   One record per solved problem, in its own key so the tally above is
   untouched. Kept to the most recent LOG_CAP; older records fall off the
   front. Same guarding as the counts: with storage off the log still
   fills in for this visit, it just does not survive a reload. */
const LOG_KEY = 'seventh-grade-math:mmmr-log';
const LOG_CAP = 200;
const LOG_SHOWN = 20;
const STATS = ['median', 'mode', 'range', 'mean'];
const STAT_LABEL = {median:'Median', mode:'Mode', range:'Range', mean:'Mean'};
let log = [];

function validRecord(r){
  return r && typeof r === 'object'
    && typeof r.t === 'number' && isFinite(r.t)
    && r.first && typeof r.first === 'object'
    && r.hints && typeof r.hints === 'object';
}

function loadLog(){
  try {
    const raw = localStorage.getItem(LOG_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed)) log = parsed.filter(validRecord).slice(-LOG_CAP);
  } catch (e) { log = []; }
}

function saveLog(){
  try { localStorage.setItem(LOG_KEY, JSON.stringify(log)); }
  catch (e) { /* full or switched off; the log stays in memory for this visit */ }
}

function clearLog(){
  log = [];
  try { localStorage.removeItem(LOG_KEY); } catch (e) {}
  drawLog();
}

/* Called from checkAll the moment all four are right. attempts[s] is the
   number of wrong submissions for that statistic, so zero means she got it
   on the first try. */
function recordSolved(){
  const rec = { t: Date.now(), tag: scene.tag, n: vals.length, first: {}, hints: {} };
  STATS.forEach(s => { rec.first[s] = attempts[s] === 0; rec.hints[s] = hintLevel[s]; });
  log.push(rec);
  if (log.length > LOG_CAP) log.splice(0, log.length - LOG_CAP);
  saveLog();
  drawLog();
}

function whenText(t){
  try {
    const d = new Date(t);
    return d.toLocaleDateString(undefined, {month:'short', day:'numeric'})
      + ', ' + d.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
  } catch (e) { return ''; }
}

function drawLog(){
  const rows = document.getElementById('logRows');
  const accuracy = document.getElementById('accuracy');
  const note = document.getElementById('accuracyNote');
  const empty = document.getElementById('logEmpty');
  const scroll = document.querySelector('.log-scroll');

  rows.textContent = '';
  accuracy.textContent = '';
  document.getElementById('export').disabled = log.length === 0;
  empty.hidden = log.length > 0;
  scroll.hidden = log.length === 0;
  if (!log.length){ note.textContent = ''; return; }

  /* first-try accuracy per statistic, across the whole log */
  STATS.forEach(s => {
    const hits = log.reduce((total, r) => total + (r.first[s] ? 1 : 0), 0);
    const li = document.createElement('li');
    const pct = document.createElement('b');
    pct.textContent = Math.round(hits * 100 / log.length) + '%';
    li.append(STAT_LABEL[s] + ' ', pct);
    accuracy.append(li);
  });
  note.textContent = 'Answered with no wrong tries, across all ' + log.length
    + (log.length === 1 ? ' record. ' : ' records. ')
    + 'Hints are counted separately, in the table.';

  /* newest first, most recent LOG_SHOWN */
  log.slice(-LOG_SHOWN).reverse().forEach(r => {
    const tr = document.createElement('tr');
    const cell = text => {
      const td = document.createElement('td');
      td.textContent = text;
      return td;
    };
    tr.append(cell(whenText(r.t)), cell(r.tag || ''), cell(r.n == null ? '' : String(r.n)));
    STATS.forEach(s => {
      const td = document.createElement('td');
      td.className = 'stat';
      const flag = document.createElement('span');
      const ok = !!r.first[s];
      flag.className = ok ? 'yes' : 'no';
      flag.textContent = ok ? 'yes' : 'no';
      td.append(flag);
      const used = Number(r.hints[s]) || 0;
      if (used){
        const h = document.createElement('span');
        h.className = 'hints';
        h.textContent = ' +' + used;
        td.append(h);
      }
      tr.append(td);
    });
    rows.append(tr);
  });
}

/* ---------------- export ----------------
   The copied text is exactly what sits under LOG_KEY, so on the other
   device it can go straight back into that key. navigator.clipboard is not
   always available from a file:// page, hence the two fallbacks. */
async function copyText(text){
  try {
    if (navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if (ok) return true;
  } catch (e) {}
  return false;
}

const hintLevel = {median:0, mode:0, range:0, mean:0};
const attempts  = {median:0, mode:0, range:0, mean:0};

const rail = document.getElementById('rail');
const hintline = document.getElementById('hintline');
const sheet = document.getElementById('sheet');
const banner = document.getElementById('banner');
const sceneEl = document.getElementById('scene');
const checkBtn = document.getElementById('check');

const rand = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const fmt = v => (v/Math.pow(10,dec)).toFixed(dec);
const isSorted = () => order.every((v,i)=> i===0 || order[i-1] <= v);

/* ---------------- problem generator ---------------- */
function counts(arr){ const c={}; arr.forEach(x=>c[x]=(c[x]||0)+1); return c; }
function modeInfo(arr){
  const c = counts(arr), top = Math.max(...Object.values(c));
  if (top === 1) return {kind:'none', vals:[]};
  const m = Object.keys(c).filter(k=>c[k]===top).map(Number).sort((a,b)=>a-b);
  return {kind: m.length===1 ? 'one' : (m.length===2 ? 'two' : 'many'), vals:m};
}

function makeProblem(){
  const roll = Math.random();
  const want = roll < .68 ? 'one' : (roll < .84 ? 'two' : 'none');
  for (let tries=0; tries<4000; tries++){
    const s = SCENES[rand(0,SCENES.length-1)];
    const n = rand(5,8);
    const v = Array.from({length:n}, ()=> rand(s.lo, s.hi));
    const sum = v.reduce((a,b)=>a+b,0);
    if (sum % n !== 0) continue;                 // mean lands exactly
    const mi = modeInfo(v);
    if (mi.kind !== want) continue;
    if (mi.kind === 'many') continue;
    if (Math.max(...v) === Math.min(...v)) continue;
    scene = s; dec = s.dec; vals = v;
    return;
  }
  // fallback that always works
  scene = SCENES[0]; dec = 1; vals = [52,56,54,55,54,53,54];
}

function truth(){
  const v = [...vals].sort((a,b)=>a-b), n = v.length, p = Math.pow(10,dec);
  const sum = v.reduce((a,b)=>a+b,0);
  const med = n%2 ? v[(n-1)/2] : (v[n/2-1] + v[n/2])/2;
  return {
    n, sortedVals:v,
    sum: sum/p,
    median: med/p,
    range: (v[n-1]-v[0])/p,
    mean: (sum/n)/p,
    mode: modeInfo(v)
  };
}

/* ---------------- rendering ---------------- */
function shuffle(){
  const v = [...vals];
  do { for(let i=v.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[v[i],v[j]]=[v[j],v[i]];} }
  while (v.every((x,i)=> i===0 || v[i-1]<=x));
  order = v;
}

function render(){
  rail.innerHTML = '';
  order.forEach((v,i)=>{
    const c = document.createElement('div');
    c.className = 'card';
    c.dataset.index = i;
    c.dataset.tag = scene.tag + ' ' + (i+1);
    c.textContent = fmt(v);
    if (picked === i) c.classList.add('picked');
    c.addEventListener('pointerdown', onDown);
    rail.appendChild(c);
  });
  const ok = isSorted();
  hintline.textContent = ok
    ? 'In order. Fill in the four answers.'
    : 'Drag the cards into order, lowest on the left. Or tap two cards to swap them.';
  hintline.classList.toggle('done', ok);
  sheet.classList.toggle('locked', !ok);
  document.querySelectorAll('#sheet input').forEach(i=> i.disabled = !ok);
  document.querySelectorAll('.hbtn').forEach(b=> b.disabled = !ok);
  checkBtn.disabled = !ok;
}

/* ---------------- drag with live reordering ---------------- */
function onDown(e){
  if (busy) return;
  const card = e.currentTarget;
  const home = +card.dataset.index;
  const cards = [...rail.children];
  const rects = cards.map(c=>c.getBoundingClientRect());
  const slot = cards.length > 1 ? (rects[1].left - rects[0].left) : 0;
  const start = {x:e.clientX, y:e.clientY};
  let moved = false, target = home;

  function shiftOthers(){
    cards.forEach((c,i)=>{
      if (c === card) return;
      let s = 0;
      if (target > home && i > home && i <= target) s = -slot;
      else if (target < home && i >= target && i < home) s = slot;
      c.style.transform = s ? `translateX(${s}px)` : 'translateX(0px)';
    });
  }
  const move = ev => {
    const dx = ev.clientX - start.x, dy = ev.clientY - start.y;
    if (!moved && Math.hypot(dx,dy) < 6) return;
    if (!moved){
      moved = true; picked = null;
      cards.forEach(c => c.classList.remove('picked'));
      card.classList.add('dragging');
      cards.forEach(c => { if (c !== card) c.classList.add('sliding'); });
    }
    card.style.transform = `translate(${dx}px, ${dy}px) scale(1.07) rotate(-2deg)`;
    let t = rects.findIndex(r => ev.clientX < r.left + r.width/2);
    if (t === -1) t = rects.length - 1;
    if (t !== target){ target = t; shiftOthers(); }
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    if (moved){
      busy = true;
      card.classList.remove('dragging');
      card.classList.add('settling');
      card.style.transform = `translate(${(target - home) * slot}px, 0px)`;
      setTimeout(()=>{
        const [m] = order.splice(home,1);
        order.splice(target,0,m);
        busy = false; render();
      }, 175);
    } else {
      if (picked === null) picked = home;
      else if (picked === home) picked = null;
      else { [order[picked], order[home]] = [order[home], order[picked]]; picked = null; }
      render();
    }
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
  e.preventDefault();
}

/* ---------------- answer checking ---------------- */
function parseNum(raw){
  const s = String(raw).replace(/[\s$,°]/g,'');
  if (!s) return null;
  if (!/^[-+]?\d*\.?\d+$/.test(s)) return null;
  const v = parseFloat(s);
  return Number.isFinite(v) ? v : null;
}
const near = (a,b) => Math.abs(a-b) < 1e-6;

function checkMode(raw, t){
  const s = String(raw).trim().toLowerCase();
  if (!s) return null;
  if (t.mode.kind === 'none')
    return /^(none|no mode|no|n\/a|nomode|-|0 modes|there is no mode)$/.test(s);
  if (/^(none|no mode|n\/a)$/.test(s)) return false;
  const parts = s.split(/[,;/]|\band\b|&/).map(p=>parseNum(p)).filter(p=>p!==null);
  if (!parts.length) return null;
  const want = t.mode.vals.map(v => v/Math.pow(10,dec)).sort((a,b)=>a-b);
  const got = [...new Set(parts)].sort((a,b)=>a-b);
  return got.length === want.length && got.every((g,i)=> near(g, want[i]));
}

function checkField(stat, showMiss){
  const row = document.querySelector(`.row[data-stat="${stat}"]`);
  const input = row.querySelector('input');
  const state = row.querySelector('.state');
  const t = truth();
  let ok;
  if (stat === 'mode') ok = checkMode(input.value, t);
  else {
    const v = parseNum(input.value);
    ok = v === null ? null : near(v, t[stat]);
  }
  row.classList.remove('right','wrong');
  if (ok === null){ state.textContent=''; return null; }
  if (ok){ row.classList.add('right'); state.textContent='correct'; input.disabled = true; }
  else if (showMiss){
    row.classList.add('wrong');
    attempts[stat]++;
    usedHintOrMiss = true;
    state.textContent = attempts[stat] >= 2 ? 'try a hint' : 'not yet';
  }
  return ok;
}

document.querySelectorAll('#sheet input').forEach(inp=>{
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); checkAll(); }});
  inp.addEventListener('input', ()=>{
    const row = inp.closest('.row');
    row.classList.remove('wrong');
    row.querySelector('.state').textContent = '';
  });
});

function checkAll(){
  const results = ['median','mode','range','mean'].map(s => checkField(s, true));
  const allRight = results.every(r => r === true);
  if (allRight){
    solved++;
    if (!usedHintOrMiss) clean++;
    saveProgress();
    drawTally();
    recordSolved();
    banner.textContent = usedHintOrMiss ? 'All four correct.' : 'All four, first try, no hints.';
    banner.classList.add('show');
    checkBtn.disabled = true;
    document.querySelectorAll('.hbtn').forEach(b=> b.disabled = true);
  }
}
checkBtn.onclick = checkAll;

/* ---------------- hints ---------------- */
function hintText(stat){
  const t = truth(), lvl = hintLevel[stat];
  const n = t.n;
  if (stat === 'median'){
    if (lvl===1) return 'The median is about position, not arithmetic. Get the cards in order first, then look at the middle.';
    if (lvl===2) return n % 2
      ? `You have ${n} cards, an odd number, so exactly one card sits in the middle. Count in ${(n-1)/2} from each end.`
      : `You have ${n} cards, an even number, so no single card is in the middle. Two of them share it.`;
    return n % 2
      ? `Count ${(n-1)/2} cards in from the left and stop. The card you land on is the median.`
      : `The two middle cards are number ${n/2} and number ${n/2+1} from the left. Add those two and divide by 2.`;
  }
  if (stat === 'mode'){
    if (lvl===1) return 'Mode sounds like most. You are looking for the value that appears most often.';
    if (lvl===2) return 'Once the cards are in order, any repeats are sitting right next to each other. Scan left to right for two matching cards.';
    return 'If no value repeats at all, there is no mode, and you type none. If two different values tie for most, both are modes.';
  }
  if (stat === 'range'){
    if (lvl===1) return 'Range measures how spread out the numbers are, not what is typical.';
    if (lvl===2) return 'You only need two of the cards: the far left one and the far right one. Ignore everything in between.';
    return 'Take the largest value and subtract the smallest.';
  }
  if (stat === 'mean'){
    if (lvl===1) return 'Mean is the same thing as average.';
    if (lvl===2) return `Add all ${n} cards together, then divide that total by ${n}.`;
    return `Your total should come to ${t.sum.toFixed(dec)}. Now divide by ${n}.`;
  }
}

document.querySelectorAll('.hbtn').forEach(b=>{
  b.onclick = ()=>{
    const stat = b.dataset.hint;
    if (hintLevel[stat] >= 3) return;
    hintLevel[stat]++;
    usedHintOrMiss = true;
    const row = document.querySelector(`.row[data-stat="${stat}"]`);
    let tip = row.querySelector('.tip');
    if (!tip){ tip = document.createElement('p'); tip.className='tip'; row.appendChild(tip); }
    tip.textContent = hintText(stat);
    if (hintLevel[stat] >= 3) b.disabled = true;
    else b.textContent = 'Another hint';
  };
});

/* ---------------- new problem ---------------- */
function newProblem(){
  makeProblem(); shuffle();
  picked = null; busy = false; usedHintOrMiss = false;
  ['median','mode','range','mean'].forEach(s=>{ hintLevel[s]=0; attempts[s]=0; });
  sceneEl.textContent = scene.text(vals.length);
  banner.classList.remove('show');
  document.querySelectorAll('.row').forEach(r=>{
    r.classList.remove('right','wrong');
    const i = r.querySelector('input');
    i.value=''; i.disabled = true;
    r.querySelector('.state').textContent = '';
    r.querySelector('.tip')?.remove();
    const h = r.querySelector('.hbtn'); h.textContent='Hint'; h.disabled = true;
  });
  render();
}
document.getElementById('next').onclick = newProblem;

/* Start over asks first. A second tap within four seconds erases. */
const clearBtn = document.getElementById('clear');
let armed = 0;
function disarm(){
  clearTimeout(armed); armed = 0;
  clearBtn.classList.remove('arming');
  clearBtn.textContent = 'Start over';
}
clearBtn.onclick = ()=>{
  if (armed){ disarm(); clearProgress(); return; }
  clearBtn.classList.add('arming');
  clearBtn.textContent = 'Tap again to erase';
  armed = setTimeout(disarm, 4000);
};

const exportBtn = document.getElementById('export');
const exportNote = document.getElementById('exportNote');
const exportBox = document.getElementById('exportBox');
let noteTimer = 0;

exportBtn.onclick = async ()=>{
  if (!log.length) return;
  const text = JSON.stringify(log, null, 2);
  const copied = await copyText(text);
  clearTimeout(noteTimer);
  if (copied){
    exportBox.hidden = true;
    exportNote.textContent = 'Copied ' + log.length
      + (log.length === 1 ? ' record.' : ' records.');
    noteTimer = setTimeout(()=>{ exportNote.textContent = ''; }, 4000);
  } else {
    /* last resort: show it so it can be selected and copied by hand */
    exportBox.value = text;
    exportBox.hidden = false;
    exportBox.focus();
    exportBox.select();
    exportNote.textContent = 'Could not reach the clipboard. Copy it from the box.';
  }
};

loadProgress();
loadLog();
drawTally();
drawLog();
newProblem();
</script>

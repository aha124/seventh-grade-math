<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walk the Line: Number Lines and Metric Length</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/style.css">
<style>
.wrap{max-width:820px;margin:0 auto;padding:0 1.25rem}
.tally{font-family:var(--display);font-weight:500;font-size:1.05rem;color:var(--ice);letter-spacing:.05em;font-variant-numeric:tabular-nums}
.modes{display:flex;gap:.4rem;margin:1.2rem 0 .2rem;flex-wrap:wrap}
.mode-tab{font-family:var(--display);font-size:1.05rem;font-weight:600;background:transparent;color:var(--board-soft);
  border:1.5px solid var(--line);border-radius:2px;min-height:44px;padding:.45rem .8rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mode-tab[aria-pressed="true"]{background:var(--board);color:#fff;border-color:var(--board)}
.mode-note{margin:.5rem 0 0;font-size:.98rem;color:var(--board-soft);max-width:58ch}
.speed-bar{display:flex;align-items:baseline;justify-content:center;gap:1.4rem;flex-wrap:wrap;margin:1rem 0 0;font-family:var(--display);font-size:1.1rem;color:var(--board-soft)}
.speed-bar b{font-size:1.6rem;font-weight:700;color:var(--board);font-variant-numeric:tabular-nums}
.q{margin:.7rem 0 0;padding:1rem .8rem;background:var(--paper);border:1.5px solid var(--line);border-radius:3px;
  font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,7vw,2.6rem);color:var(--board);text-align:center;font-variant-numeric:tabular-nums}
.q small{display:block;font-family:var(--body);font-weight:500;font-size:.95rem;color:#7C93A5}
.line-wrap{margin:.8rem 0 0;padding:.4rem 0 .2rem;background:var(--paper);border:1.5px solid var(--line);border-radius:3px;overflow-x:auto;-webkit-overflow-scrolling:touch}
svg.nl{display:block;min-width:640px;width:100%;height:120px;touch-action:manipulation}
.nl .tick{stroke:var(--board);stroke-width:1.5}
.nl .axis{stroke:var(--board);stroke-width:2}
.nl .num{font-family:var(--display);font-size:15px;font-weight:600;fill:var(--board-soft);text-anchor:middle}
.nl .zero{fill:var(--board);font-weight:700}
.nl .hit{fill:transparent;cursor:pointer}
.nl .dot{fill:var(--edge)}
.nl .dot.ok{fill:var(--good)} .nl .dot.no{fill:var(--gold)}
.nl .hop{fill:none;stroke:var(--gold);stroke-width:3}
.nl .shade{stroke:var(--good);stroke-width:6;stroke-linecap:round}
.nl .ring{stroke:var(--good);stroke-width:3}
.choices{display:flex;gap:.5rem;flex-wrap:wrap;margin:.8rem 0 0;justify-content:center}
.choice{font-family:var(--display);font-size:1.15rem;font-weight:600;min-height:48px;padding:.3rem 1rem;cursor:pointer;
  background:var(--paper);color:var(--board);border:1.5px solid var(--edge);border-radius:3px;-webkit-tap-highlight-color:transparent}
.choice[aria-pressed="true"]{background:var(--edge);color:#fff}
.answer-row{display:flex;align-items:center;justify-content:center;gap:.6rem;flex-wrap:wrap;margin:.9rem 0 0;padding:.8rem;background:#FFFDF8;border:1.5px solid var(--gold);border-radius:3px}
.decbox{width:8rem;min-height:44px;text-align:center;font-family:var(--display);font-weight:700;font-size:1.6rem;border:1.5px solid var(--edge);border-radius:3px;background:#FFFDF8;color:var(--board)}
.unit{font-family:var(--display);font-weight:700;font-size:1.4rem;color:var(--board-soft)}
.ok{min-width:44px;min-height:44px;padding:0 .8rem;font-family:var(--display);font-size:1.2rem;font-weight:700;background:var(--gold);border:1.5px solid var(--gold);color:#fff;border-radius:3px;cursor:pointer}
.say{min-height:3.2em;margin:.8rem 0 0;padding:.6rem .8rem;border-radius:2px;font-size:1rem;color:var(--board-soft);background:#F6FAFC;border-left:4px solid var(--line)}
.say.good{border-left-color:var(--good)} .say.bad{border-left-color:var(--gold);color:var(--board)}
.say b{color:var(--board)}
.banner{margin:1rem 0 0;padding:.8rem 1rem;border-radius:3px;background:#E8F4EC;border:1.5px solid var(--good);color:var(--good);font-family:var(--display);font-size:1.3rem;font-weight:600;display:none}
.banner.show{display:block} .banner.best{background:#FBF5EA;border-color:var(--gold);color:#8A5F1E}
.actions{display:flex;gap:.6rem;margin:1rem 0 0;flex-wrap:wrap}
.foot{margin:2rem 0 0;font-size:.92rem;color:#7C93A5;max-width:60ch}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="board">
  <div class="wrap">
    <div class="board-nav"><a class="backlink" href="../index.html">All lessons</a></div>
    <h1 class="mark">Walk the <span>Line</span></h1>
    <div class="tally" id="tally">Solved 0 / Clean 0</div>
  </div>
</header>
<main class="wrap">
  <div class="modes" id="modes"></div>
  <p class="mode-note" id="note"></p>
  <div class="speed-bar" id="speedBar" hidden><span>Seconds left <b id="clock">60</b></span><span>Correct <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
  <div class="q" id="q"></div>
  <div id="lineView"><div class="line-wrap"><svg class="nl" id="nl" viewBox="0 0 680 120" aria-label="Number line"></svg></div></div>
  <div class="choices" id="graphChoices" hidden>
    <button class="choice" type="button" data-c="open">○ Open</button>
    <button class="choice" type="button" data-c="closed">● Filled</button>
    <button class="choice" type="button" data-d="L">← Left</button>
    <button class="choice" type="button" data-d="R">Right →</button>
  </div>
  <div class="answer-row" id="metricRow" hidden>
    <input class="decbox" id="mBox" type="text" inputmode="decimal" autocomplete="off" aria-label="Your answer">
    <span class="unit" id="mUnit"></span>
    <button class="ok" id="mOk" type="button">✓</button>
  </div>
  <p class="say" id="say" aria-live="polite"></p>
  <div class="banner" id="banner"></div>
  <div class="actions">
    <button class="btn primary" id="next" type="button">New problem</button>
    <button class="btn ghost" id="check" type="button" hidden>Check</button>
  </div>
  <p class="foot">Plus moves right, minus moves left. The number further right is always bigger. Filled circle: that number counts. Open circle: it doesn't.</p>
</main>
<script src="../shared/tokens.js"></script>
<script>
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[rand(0, a.length - 1)];
const sgn = v => v < 0 ? '−' + Math.abs(v) : String(v);
const LO = -12, HI = 12, X = v => 30 + (v - LO) * (620 / (HI - LO)), Y = 70;
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || $('nl')).append(e); return e; }

const KEY = 'seventh-grade-math:walk';
let solved = 0, clean = 0, best = 0;
try { const s = JSON.parse(localStorage.getItem(KEY) || '{}'); solved = s.solved | 0; clean = s.clean | 0; best = s.best | 0; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ solved, clean, best })); } catch (e) {} };
const drawTally = () => { $('tally').textContent = 'Solved ' + solved + ' / Clean ' + clean; };
function say(kind, lead, extra){ const e = $('say'); e.className = 'say' + (kind ? ' ' + kind : ''); e.textContent = ''; if (!lead) return; const b = document.createElement('b'); b.textContent = lead; e.append(b); if (extra) e.append(' ' + extra); }
function banner(t, isBest){ const b = $('banner'); b.className = 'banner' + (t ? ' show' : '') + (isBest ? ' best' : ''); b.textContent = t || ''; }
function finished(isClean){ solved++; if (isClean) clean++; save(); drawTally(); if (window.Tokens) Tokens.earnSolve({ clean: isClean, source: 'walk' }); }

/* the line: ticks and numbers, and an invisible tap target on each integer */
let onTap = null;
function drawLine(){
  const svg = $('nl'); svg.textContent = '';
  el('line', { x1: 14, y1: Y, x2: 666, y2: Y, class: 'axis' });
  el('path', { d: 'M14 ' + Y + ' l10 -6 v12 z', fill: 'var(--board)' }); el('path', { d: 'M666 ' + Y + ' l-10 -6 v12 z', fill: 'var(--board)' });
  for (let v = LO; v <= HI; v++){
    el('line', { x1: X(v), y1: Y - 7, x2: X(v), y2: Y + 7, class: 'tick' });
    const t = el('text', { x: X(v), y: Y + 28, class: 'num' + (v === 0 ? ' zero' : '') }); t.textContent = sgn(v);
  }
  for (let v = LO; v <= HI; v++){
    const h = el('rect', { x: X(v) - 13, y: 10, width: 26, height: 100, class: 'hit' });
    h.addEventListener('click', () => { if (onTap) onTap(v); });
  }
}
function center(v){ const w = document.querySelector('.line-wrap'); if (w.scrollWidth > w.clientWidth) w.scrollLeft = X(v) / 680 * w.scrollWidth - w.clientWidth / 2; }
function dot(v, cls){ el('circle', { cx: X(v), cy: Y, r: 8, class: 'dot ' + (cls || '') }); }
function hop(a, b){
  const mid = (X(a) + X(b)) / 2, h = Math.min(55, 12 + Math.abs(b - a) * 4);
  el('path', { d: 'M' + X(a) + ' ' + (Y - 6) + ' Q' + mid + ' ' + (Y - 6 - h) + ' ' + X(b) + ' ' + (Y - 6), class: 'hop' });
  const d = b > a ? -1 : 1;
  el('path', { d: 'M' + X(b) + ' ' + (Y - 6) + ' l' + (8 * d) + ' -9 l' + (3 * d) + ' 10 z', fill: 'var(--gold)' });
}

/* ---------------- Move it ---------------- */
let cur = null, misses = 0, done = false;
function makeMove(){
  for (;;){
    const a = rand(-9, 9), n = rand(1, 12), right = Math.random() < 0.5, b = right ? a + n : a - n;
    if (b < LO || b > HI) continue;
    const words = Math.random() < 0.35;
    const text = words ? 'Start at ' + sgn(a) + ', move ' + n + (right ? ' right' : ' left') : (a < 0 ? sgn(a) : (Math.random() < .3 ? '+' : '') + a) + (right ? ' + ' : ' − ') + n;
    return { a, n, right, b, text };
  }
}
function showMove(p, smallLabel){
  cur = p; misses = 0; done = false;
  $('q').innerHTML = ''; const sm = document.createElement('small'); sm.textContent = smallLabel || 'Tap the answer on the line'; $('q').append(sm, p.text);
  drawLine(); dot(p.a, ''); center(p.b > p.a ? p.a + 3 : p.a - 3);
  onTap = v => tapMove(v);
}
function tapMove(v){
  if (done || !cur) return;
  const p = cur;
  if (v === p.b){
    done = true; drawLine(); dot(p.a); hop(p.a, p.b); dot(p.b, 'ok');
    if (speedOn){ score++; $('score').textContent = score; say('good', sgn(p.b) + '.', ''); setTimeout(() => { if (speedOn) showMove(makeMove(), 'Fast!'); }, 500); return; }
    finished(misses === 0);
    banner(misses ? 'Got it.' : 'Right, first try.');
    say('good', sgn(p.b) + '.', (p.right ? p.n + ' hops right' : p.n + ' hops left') + ' from ' + sgn(p.a) + '. Tap New problem.');
    return;
  }
  misses++;
  if (speedOn){ done = true; drawLine(); dot(p.a); hop(p.a, p.b); dot(p.b, 'ok'); say('bad', 'It\'s ' + sgn(p.b) + '.', ''); setTimeout(() => { if (speedOn) showMove(makeMove(), 'Fast!'); }, 1400); return; }
  drawLine(); dot(p.a); dot(v, 'no');
  if (v === (p.right ? p.a - p.n : p.a + p.n)) say('bad', 'That went the wrong way.', p.right ? 'Plus moves right.' : 'Minus moves left.');
  else if (Math.abs(v - p.b) === 1) say('bad', 'Off by one.', 'Count the jumps between ticks, not the ticks.');
  else say('bad', 'Not that one.', 'Start at ' + sgn(p.a) + ' and count ' + p.n + (p.right ? ' to the right.' : ' to the left.'));
}

/* ---------------- Graph it ---------------- */
let g = null, pickC = null, pickD = null, pickV = null;
const SYM = { '>': ['open', 'R'], '<': ['open', 'L'], '≥': ['closed', 'R'], '≤': ['closed', 'L'] };
function makeGraph(){ const s = pick(Object.keys(SYM)); return { s, v: rand(-6, 6), L: pick(['x', 'y', 'n', 'b', 'd', 'w', 'p', 'm']) }; }
function showGraph(p){
  g = p; pickC = pickD = pickV = null; misses = 0; done = false;
  $('q').innerHTML = ''; const sm = document.createElement('small'); sm.textContent = 'Pick the circle, tap the number, pick the direction'; $('q').append(sm, p.L + ' ' + p.s + ' ' + sgn(p.v));
  document.querySelectorAll('#graphChoices .choice').forEach(b => b.setAttribute('aria-pressed', 'false'));
  drawGraph(); center(p.v); onTap = v => { if (!done){ pickV = v; drawGraph(); } };
}
function drawGraph(){
  drawLine();
  if (pickV === null) return;
  if (pickD){ const end = pickD === 'R' ? 656 : 24; el('line', { x1: X(pickV), y1: Y, x2: end, y2: Y, class: 'shade' }); }
  el('circle', { cx: X(pickV), cy: Y, r: 9, class: 'ring', fill: pickC === 'closed' ? 'var(--good)' : '#fff' });
}
document.querySelectorAll('#graphChoices .choice').forEach(b => b.addEventListener('click', () => {
  if (done) return;
  if (b.dataset.c){ pickC = b.dataset.c; document.querySelectorAll('#graphChoices [data-c]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }
  if (b.dataset.d){ pickD = b.dataset.d; document.querySelectorAll('#graphChoices [data-d]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }
  drawGraph();
}));
function checkGraph(){
  if (done) return;
  if (!pickC || !pickD || pickV === null){ say('', 'Three choices:', 'open or filled, the number, and left or right.'); return; }
  const [c, d] = SYM[g.s];
  if (pickV === g.v && pickC === c && pickD === d){
    done = true; finished(misses === 0); banner(misses ? 'Got it.' : 'Right, first try.');
    say('good', 'That\'s it.', (c === 'closed' ? sgn(g.v) + ' counts, so the circle is filled' : sgn(g.v) + ' doesn\'t count, so the circle is open') + ', and every number ' + (d === 'R' ? 'bigger' : 'smaller') + ' is shaded. Tap New problem.');
    return;
  }
  misses++;
  if (pickV !== g.v) say('bad', 'Check the number.', 'The circle goes on ' + sgn(g.v) + '.');
  else if (pickC !== c) say('bad', 'Check the circle.', g.s === '≥' || g.s === '≤' ? 'A line under the symbol means "or equal," so the number counts: filled.' : 'No line under the symbol, so ' + sgn(g.v) + ' itself doesn\'t count: open.');
  else say('bad', 'Check the direction.', (g.s === '>' || g.s === '≥' ? 'Greater than means the bigger numbers, to the right.' : 'Less than means the smaller numbers, to the left.'));
}

/* ---------------- Metric ---------------- */
const U = { mm: 0, cm: 1, m: 3, km: 6 };
let mp = null;
function fmtNum(s){ return s.replace(/\B(?=(\d{3})+(?!\d)(?=\.|$))/g, ','); }
function scale(str, k){ /* move the point k places right (negative = left), exact */
  let [w, f = ''] = str.split('.'); let digits = w + f, pos = w.length + k;
  while (pos > digits.length) digits += '0';
  while (pos < 1){ digits = '0' + digits; pos++; }
  let out = digits.slice(0, pos) + '.' + digits.slice(pos);
  out = out.replace(/^0+(?=\d)/, '').replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
  if (out.startsWith('.')) out = '0' + out;
  return out || '0';
}
function makeMetric(){
  const pairs = [['cm', 'mm'], ['mm', 'cm'], ['m', 'cm'], ['cm', 'm'], ['km', 'm'], ['m', 'km']];
  const [from, to] = pick(pairs);
  const n = pick([String(rand(2, 90)), rand(1, 9) + '.' + rand(1, 9), String(rand(1, 9) * 250), String(rand(11, 99) * 10)]);
  return { from, to, n, ans: scale(n, U[from] - U[to]) };
}
function showMetric(p){
  mp = p; misses = 0; done = false;
  $('q').innerHTML = ''; const sm = document.createElement('small'); sm.textContent = 'Convert'; $('q').append(sm, fmtNum(p.n) + ' ' + p.from + ' = ? ' + p.to);
  $('mUnit').textContent = p.to; $('mBox').value = ''; $('mBox').focus();
}
function checkMetric(){
  if (done) return;
  const v = $('mBox').value.replace(/,/g, '').trim();
  if (!/^\d*\.?\d+$|^\d+\.$/.test(v)){ say('', 'Type a number.'); return; }
  const norm = s => scale(s, 0);
  if (norm(v) === mp.ans){
    done = true; finished(misses === 0); banner(misses ? 'Got it.' : 'Right, first try.');
    const k = U[mp.from] - U[mp.to];
    say('good', fmtNum(mp.ans) + ' ' + mp.to + '.', (k > 0 ? 'Smaller unit, so more of them: × ' + (10 ** k).toLocaleString() : 'Bigger unit, so fewer of them: ÷ ' + (10 ** -k).toLocaleString()) + '. Tap New problem.');
    return;
  }
  misses++;
  const k = U[mp.from] - U[mp.to];
  if (norm(v) === scale(mp.n, -k)) say('bad', 'The point went the wrong way.', k > 0 ? 'Going to a smaller unit, the number gets bigger.' : 'Going to a bigger unit, the number gets smaller.');
  else say('bad', 'Not that.', '1 ' + (k > 0 ? mp.from + ' = ' + (10 ** k).toLocaleString() + ' ' + mp.to : mp.to + ' = ' + (10 ** -k).toLocaleString() + ' ' + mp.from) + '.');
}
$('mOk').onclick = checkMetric;
$('mBox').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); checkMetric(); } });

/* ---------------- Hop round ---------------- */
let speedOn = false, score = 0, endsAt = 0, timer = 0;
function startRound(){ speedOn = true; score = 0; $('score').textContent = 0; banner(''); endsAt = Date.now() + 60000; $('next').textContent = 'Stop'; clearInterval(timer); timer = setInterval(tick, 200); tick(); say('', 'Tap fast.'); showMove(makeMove(), 'Fast!'); }
function tick(){ const left = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000)); $('clock').textContent = left; if (left <= 0) stopRound(); }
function stopRound(){
  if (!speedOn) return; speedOn = false; clearInterval(timer); onTap = null; $('next').textContent = 'Start the round';
  const isBest = score > best; if (isBest){ best = score; save(); $('best').textContent = best; if (score > 0 && window.Tokens) Tokens.earnBest('walk:round'); }
  banner(isBest ? score + ' right. That is a new best.' : score + ' right. Best so far is ' + best + '.', isBest); say('', '');
}

/* ---------------- modes ---------------- */
const MODES = [
  { key: 'move', tab: 'Move it', note: 'Start where the first number is. Plus moves right, minus moves left. Tap where you land.' },
  { key: 'graph', tab: 'Graph it', note: 'Open or filled circle, which number, which direction. Then Check.' },
  { key: 'metric', tab: 'Metric', note: 'mm, cm, m, km. Smaller unit, bigger number: move the point right.' },
  { key: 'round', tab: 'Hop round', note: 'Sixty seconds of hops.' }
];
let mode = 'move';
MODES.forEach(m => { const b = document.createElement('button'); b.className = 'mode-tab'; b.type = 'button'; b.textContent = m.tab; b.onclick = () => setMode(m.key); $('modes').append(b); });
function setMode(k){
  if (speedOn) stopRound();
  mode = k; onTap = null;
  Array.prototype.forEach.call($('modes').children, (b, i) => b.setAttribute('aria-pressed', String(MODES[i].key === k)));
  $('note').textContent = MODES.find(m => m.key === k).note;
  $('lineView').hidden = k === 'metric'; $('graphChoices').hidden = k !== 'graph'; $('metricRow').hidden = k !== 'metric';
  $('check').hidden = k !== 'graph'; $('speedBar').hidden = k !== 'round'; banner(''); say('', '');
  if (k === 'round'){ $('next').textContent = 'Start the round'; $('best').textContent = best; $('clock').textContent = 60; $('q').innerHTML = '<small>Hop round</small>Ready?'; drawLine(); return; }
  $('next').textContent = 'New problem'; next();
}
function next(){ banner(''); say('', ''); if (mode === 'move') showMove(makeMove()); else if (mode === 'graph') showGraph(makeGraph()); else showMetric(makeMetric()); }
$('next').onclick = () => { if (mode === 'round'){ if (speedOn) stopRound(); else startRound(); } else next(); };
$('check').onclick = checkGraph;

const ok = scale('12', 1) === '120' && scale('80', -1) === '8' && scale('17', 3) === '17000' && scale('5250', -3) === '5.25' && scale('3.5', 2) === '350' && scale('450', -3) === '0.45';
drawTally();
if (!ok){ say('bad', 'This page has a problem.', 'Do not use it until it is fixed.'); }
else { const m = /[#&]tab=([a-z]+)/.exec(location.hash || ''); setMode(m && MODES.some(x => x.key === m[1]) ? m[1] : 'move'); }
</script>
</body>
</html>
